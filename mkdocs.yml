site_name: Biotope
site_description: Biotope is a framework that helps AI agents build and maintain purpose-driven knowledge representations.
site_author: BioCypher Team
site_url: https://biocypher.github.io/biotope/

markdown_extensions:
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets:
      check_paths: true
  - mkdocs-click

theme:
  features:
    - content.code.annotate
    - content.code.copy
    - navigation.indexes
    - navigation.instant
    - navigation.tracking
    - navigation.top
  name: material
  palette:
    - scheme: default
      primary: blue grey
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue grey
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Get started: get-started.md
  - Working with the agent: agent.md
  - Use the result: result.md
  - Your project: project.md
  - Documents: extraction.md
  - Tutorial: tutorial.md
  - Reference:
      - CLI: cli.md
      - Changelog: changelog.md

validation:
  links:
    anchors: warn

plugins:
  - search

extra:
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/biocypher
      name: BioCypher Team

copyright: Copyright &copy; 2025–2026 BioCypher Team

repo_url: https://github.com/biocypher/biotope
repo_name: biocypher/biotope
edit_uri: edit/main/docs

watch:
  - biotope
  - README.md
  - CHANGELOG.md
