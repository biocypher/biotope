name: Test Suite

on:
  workflow_dispatch: {}
  workflow_call: {}

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: uv sync --locked --extra dev --extra graph

      - name: Verify graph checker installation
        run: uv run python -m pyright --version

      - name: Check typed engine
        run: uv run pyright

      - name: Run tests
        run: uv run pytest tests/ -v

  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Install documentation dependencies
        run: uv sync --locked --extra dev
      - name: Check documentation
        run: uv run mkdocs build --strict
