name: Test Suite

on:
  workflow_dispatch: {}
  workflow_call: {}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: uv sync --extra dev --extra graph

      - name: Verify graph checker installation
        run: uv run python -m pyright --version

      - name: Check typed engine
        run: uv run pyright

      - name: Run tests
        run: uv run pytest tests/ -v
