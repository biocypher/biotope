name: CI Docs Biotope

on:
  push:
    tags:
      - 'v*'
      - 'biotope-v*'
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to document (defaults to the selected branch)
        required: false
        type: string
  workflow_call:
    inputs:
      ref:
        description: Release tag to document
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: biotope-docs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Build documentation
        run: uv run mkdocs build --strict

      - name: Deploy documentation with mike
        run: |
          VERSION=$(uv run python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          uv run mike deploy --push --update-aliases "$VERSION" latest
          uv run mike set-default --push latest
