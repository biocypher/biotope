name: Question
description: Ask about using Biotope
title: "[Question] "
labels: [question]
body:
  - type: checkboxes
    attributes:
      label: Existing guidance
      description: Check the documentation and existing issues for relevant examples.
      options:
        - label: I checked the [documentation](https://biocypher.github.io/biotope/) and [existing issues](https://github.com/biocypher/biotope/issues).
          required: true
  - type: textarea
    attributes:
      label: Question
      description: Describe the goal, the commands you tried and where you need help.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Environment
      description: Include your Biotope and Python versions and operating system when relevant.
    validations:
      required: false
